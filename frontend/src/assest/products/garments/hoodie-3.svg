<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity="0.15"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="500" height="500" rx="24" fill="url(#bgGrad)"/>
  <!-- Subtly stylish border and brand watermark -->
  <rect x="12" y="12" width="476" height="476" rx="16" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6"/>
  <g filter="url(#shadow)">
    
    <!-- Hood Outline -->
    <path d="M 195 105 Q 250 45 305 105 Z" fill="#1d4ed8" stroke="#00000033" stroke-width="2"/>
    <!-- Hoodie Body -->
    <path d="M 180 110 L 85 170 L 65 330 L 105 340 L 138 230 L 140 375 Q 250 395 360 375 L 362 230 L 395 340 L 435 330 L 415 170 L 320 110 Z" 
          fill="#2563eb" stroke="#00000033" stroke-width="2"/>
    <!-- Ribbed Cuffs -->
    <rect x="65" y="322" width="40" height="20" rx="3" transform="rotate(15 85 330)" fill="#1d4ed8" stroke="#00000033" stroke-width="1.5"/>
    <rect x="395" y="322" width="40" height="20" rx="3" transform="rotate(-15 415 330)" fill="#1d4ed8" stroke="#00000033" stroke-width="1.5"/>
    <!-- Ribbed Waistband -->
    <path d="M 140 365 Q 250 385 360 365 L 360 388 Q 250 408 140 388 Z" fill="#1d4ed8" stroke="#00000033" stroke-width="2"/>
    
    <!-- Kangaroo Pocket or Zip -->
    
      <line x1="250" y1="130" x2="250" y2="385" stroke="#94a3b8" stroke-width="3"/>
      <!-- Split Pockets -->
      <path d="M 180 345 L 240 345 L 240 270 L 195 295 Z" fill="#1d4ed8" opacity="0.3" stroke="#00000033" stroke-width="1.5"/>
      <path d="M 320 345 L 260 345 L 260 270 L 305 295 Z" fill="#1d4ed8" opacity="0.3" stroke="#00000033" stroke-width="1.5"/>
    
    <!-- Drawstrings -->
    <path d="M 235 130 Q 230 170 232 205" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="232" cy="207" r="2.5" fill="#475569"/>
    <path d="M 265 130 Q 270 170 268 205" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="268" cy="207" r="2.5" fill="#475569"/>
    <!-- Hood Overlap -->
    <path d="M 215 110 Q 250 140 285 110" fill="none" stroke="#00000033" stroke-width="2"/>
  
  
  </g>
  <text x="250" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="2">ZIPPER HOODIE </text>
</svg>