<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity="0.15"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="500" height="500" rx="24" fill="url(#bgGrad)"/>
  <!-- Subtly stylish border and brand watermark -->
  <rect x="12" y="12" width="476" height="476" rx="16" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6"/>
  <g filter="url(#shadow)">
    
    <g transform="translate(100, 100)">
      <rect width="300" height="300" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="150" cy="120" r="60" fill="#0284c715"/>
      <g transform="translate(110, 80) scale(1.6)">
        <path d="M 11 4 L 19 4 L 26 9 L 23 15 L 21 13 L 21 24 L 9 24 L 9 13 L 7 15 L 4 9 Z" fill="#0284c7"/>
      </g>
      <text x="150" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">Modern Jackets</text>
      <text x="150" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Orange Garments Collection</text>
      <rect x="95" y="258" width="110" height="24" rx="12" fill="#0284c720"/>
      <text x="150" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">PREMIUM QUALITY</text>
    </g>
  
  </g>
  <text x="250" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="2">ORANGE GARMENTS • JACKETS</text>
</svg>