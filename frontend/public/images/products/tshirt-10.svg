<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity="0.15"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="500" height="500" rx="24" fill="url(#bgGrad)"/>
  <!-- Subtly stylish border and brand watermark -->
  <rect x="12" y="12" width="476" height="476" rx="16" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6"/>
  <g filter="url(#shadow)">
    
    
    <!-- T-Shirt Body -->
    <path d="M 175 110 L 100 155 L 75 220 L 120 240 L 145 195 L 150 380 Q 250 395 350 380 L 355 195 L 380 240 L 425 220 L 400 155 L 325 110 Z" fill="#d97706" stroke="#00000033" stroke-width="2"/>
    
    <!-- Crew Neck Ribbing -->
    <path d="M 210 100 Q 250 135 290 100" fill="none" stroke="#fbbf24" stroke-width="8"/>
    <path d="M 210 100 Q 250 135 290 100" fill="none" stroke="#00000033" stroke-width="1.5"/>
  
    <!-- Graphic Print / Logo on Chest -->
    <circle cx="250" cy="220" r="32" fill="#fbbf24" opacity="0.25"/>
    <path d="M 235 220 L 250 205 L 265 220 L 250 235 Z" fill="#fbbf24" opacity="0.7"/>
    <text x="250" y="265" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fbbf24" opacity="0.8" text-anchor="middle" letter-spacing="1">AUTHENTIC</text>
  
    <!-- Hem Stitches -->
    <path d="M 152 370 Q 250 385 348 370" fill="none" stroke="#00000022" stroke-width="1.5" stroke-dasharray="4,4"/>
  
  </g>
  <text x="250" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="2">COTTON BLEND T-SHIRT </text>
</svg>