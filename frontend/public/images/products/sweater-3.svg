<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity="0.15"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="500" height="500" rx="24" fill="url(#bgGrad)"/>
  <!-- Subtly stylish border and brand watermark -->
  <rect x="12" y="12" width="476" height="476" rx="16" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6"/>
  <g filter="url(#shadow)">
    
    <!-- Knit Cable Texture Pattern -->
    <pattern id="knitPattern" width="16" height="24" patternUnits="userSpaceOnUse">
      <path d="M 4 0 Q 8 6 4 12 Q 0 18 4 24" fill="none" stroke="#ffffff" opacity="0.12" stroke-width="1.5"/>
      <path d="M 12 0 Q 16 6 12 12 Q 8 18 12 24" fill="none" stroke="#000000" opacity="0.08" stroke-width="1.5"/>
    </pattern>
    <!-- Sweater Silhouette -->
    <path d="M 180 110 L 90 175 L 70 330 L 110 340 L 140 230 L 145 375 Q 250 390 355 375 L 360 230 L 390 340 L 430 330 L 410 175 L 320 110 Z" 
          fill="#65a30d" stroke="#00000033" stroke-width="2"/>
    <!-- Knit Overlay -->
    <path d="M 180 110 L 90 175 L 70 330 L 110 340 L 140 230 L 145 375 Q 250 390 355 375 L 360 230 L 390 340 L 430 330 L 410 175 L 320 110 Z" 
          fill="url(#knitPattern)"/>
    <!-- Thick Ribbed Collar -->
    <path d="M 210 102 Q 250 135 290 102 L 285 92 Q 250 112 215 92 Z" fill="#4d7c0f" stroke="#00000033" stroke-width="2"/>
    <!-- Ribbed Cuffs -->
    <rect x="70" y="322" width="40" height="18" rx="2" transform="rotate(15 90 330)" fill="#4d7c0f" stroke="#00000033" stroke-width="1.5"/>
    <rect x="390" y="322" width="40" height="18" rx="2" transform="rotate(-15 410 330)" fill="#4d7c0f" stroke="#00000033" stroke-width="1.5"/>
    <!-- Ribbed Waistband -->
    <path d="M 145 365 Q 250 380 355 365 L 355 385 Q 250 400 145 385 Z" fill="#4d7c0f" stroke="#00000033" stroke-width="2"/>
  
  </g>
  <text x="250" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="2">LIGHTWEIGHT PULLOVER </text>
</svg>