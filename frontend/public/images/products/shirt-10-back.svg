<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity="0.15"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="500" height="500" rx="24" fill="url(#bgGrad)"/>
  <!-- Subtly stylish border and brand watermark -->
  <rect x="12" y="12" width="476" height="476" rx="16" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6"/>
  <g filter="url(#shadow)">
    
    <pattern id="p_StripedBusinessShirt" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#60a5fa"/>
      <line x1="0" y1="0" x2="0" y2="16" stroke="#ffffff" stroke-width="4" opacity="0.4"/>
    </pattern>
    <!-- Main Body & Sleeves -->
    <g id="shirtBody">
      <!-- Body contour -->
      <path d="M 185 105 L 115 145 L 90 235 L 130 250 L 155 195 L 160 380 Q 250 405 340 380 L 345 195 L 370 250 L 410 235 L 385 145 L 315 105 Z" 
            fill="url(#p_StripedBusinessShirt)" stroke="#00000033" stroke-width="2"/>
      <!-- Sleeve Cuffs -->
      <path d="M 90 235 L 130 250 L 126 260 L 86 245 Z" fill="#ffffff" stroke="#00000033" stroke-width="1.5"/>
      <path d="M 410 235 L 370 250 L 374 260 L 414 245 Z" fill="#ffffff" stroke="#00000033" stroke-width="1.5"/>
      <!-- Inner Neck Arc -->
      <path d="M 215 105 Q 250 120 285 105" fill="none" stroke="#00000044" stroke-width="2"/>
    </g>
    
    <!-- Back Yoke Seam -->
    <path d="M 160 145 Q 250 155 340 145" fill="none" stroke="#00000033" stroke-width="2"/>
    <!-- Center Back Pleat -->
    <line x1="250" y1="155" x2="250" y2="385" stroke="#00000022" stroke-width="1.5" stroke-dasharray="4,4"/>
    <!-- Back Collar -->
    <path d="M 220 100 Q 250 112 280 100 L 275 92 Q 250 100 225 92 Z" fill="#ffffff" stroke="#00000033" stroke-width="1.5"/>
  
  
  </g>
  <text x="250" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="2">STRIPED BUSINESS SHIRT (BACK)</text>
</svg>