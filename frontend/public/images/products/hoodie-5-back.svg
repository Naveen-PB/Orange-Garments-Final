<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity="0.15"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="500" height="500" rx="24" fill="url(#bgGrad)"/>
  <!-- Subtly stylish border and brand watermark -->
  <rect x="12" y="12" width="476" height="476" rx="16" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6"/>
  <g filter="url(#shadow)">
    
    <!-- Hood Outline -->
    <path d="M 195 105 Q 250 45 305 105 Z" fill="#c2410c" stroke="#00000033" stroke-width="2"/>
    <!-- Hoodie Body -->
    <path d="M 180 110 L 85 170 L 65 330 L 105 340 L 138 230 L 140 375 Q 250 395 360 375 L 362 230 L 395 340 L 435 330 L 415 170 L 320 110 Z" 
          fill="#ea580c" stroke="#00000033" stroke-width="2"/>
    <!-- Ribbed Cuffs -->
    <rect x="65" y="322" width="40" height="20" rx="3" transform="rotate(15 85 330)" fill="#c2410c" stroke="#00000033" stroke-width="1.5"/>
    <rect x="395" y="322" width="40" height="20" rx="3" transform="rotate(-15 415 330)" fill="#c2410c" stroke="#00000033" stroke-width="1.5"/>
    <!-- Ribbed Waistband -->
    <path d="M 140 365 Q 250 385 360 365 L 360 388 Q 250 408 140 388 Z" fill="#c2410c" stroke="#00000033" stroke-width="2"/>
    
    <!-- Hanging Hood on Back -->
    <path d="M 200 95 Q 250 180 300 95 Q 250 80 200 95 Z" fill="#c2410c" stroke="#00000044" stroke-width="2"/>
    <path d="M 220 100 Q 250 160 280 100" fill="none" stroke="#00000022" stroke-width="1.5"/>
  
  
  </g>
  <text x="250" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="2">ATHLETIC HOODIE (BACK)</text>
</svg>